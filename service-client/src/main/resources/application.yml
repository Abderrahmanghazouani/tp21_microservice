server:
  port: 8081

spring:
  application:
    name: SERVICE-CLIENT   # nom utilise dans Eureka ET par WebClient (http://SERVICE-CLIENT/...)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # bases separees du TP20 pour ne pas melanger les schemas (TP20 : brand/model, TP21 : marque/modele)
    url: jdbc:mysql://localhost:3306/clientservicedb_wc?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
